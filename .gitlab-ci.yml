# Builds the Linux AppImage and the Windows installer, both on Linux runners.
#  - Every pipeline: typecheck + tests, then build the AppImage and the Windows installer
#    (cross-compiled with Wine) as downloadable job artifacts.
#  - Tags like v1.2.3: also upload both to the project's Generic Package Registry
#    (permanent) and create a GitLab Release linking to them.
#
# No Stripe key is needed or used in CI: building the app doesn't talk to Stripe.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never # avoid duplicate branch + MR pipelines
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - build
  - release

variables:
  NODE_IMAGE: node:22-bookworm
  npm_config_cache: $CI_PROJECT_DIR/.cache/npm
  ELECTRON_CACHE: $CI_PROJECT_DIR/.cache/electron
  ELECTRON_BUILDER_CACHE: $CI_PROJECT_DIR/.cache/electron-builder
  PACKAGE_REGISTRY_URL: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/stripe-analytics

.node:
  image: $NODE_IMAGE
  cache:
    key:
      files: [package-lock.json]
    paths: [.cache/]
  before_script:
    - npm ci --prefer-offline --no-audit --no-fund

# Tagged builds take their version from the tag (v1.2.3 -> 1.2.3).
.set-version: &set-version
  - |
    if [ -n "$CI_COMMIT_TAG" ]; then
      npm version --no-git-tag-version --allow-same-version "${CI_COMMIT_TAG#v}"
    fi
  - VERSION=$(node -p "require('./package.json').version")

# Tags: keep a permanent copy in the package registry (job artifacts expire). Args: files.
.upload-to-registry: &upload-to-registry
  - |
    upload() {
      [ -n "$CI_COMMIT_TAG" ] || return 0
      for f in "$@"; do
        curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$f" "$PACKAGE_REGISTRY_URL/$VERSION/$(basename "$f")"
      done
    }

test:
  extends: .node
  stage: test
  script:
    - npm run typecheck
    - npm test

appimage:
  extends: .node
  stage: build
  needs: [test]
  script:
    - *set-version
    - *upload-to-registry
    - npm run dist:appimage
    # Copy into a fixed folder: expose_as doesn't allow wildcards in artifact paths.
    - mkdir -p appimage
    - cp "release/stripe-analytics-${VERSION}-x86_64.AppImage" appimage/
    - APPIMAGE="appimage/stripe-analytics-${VERSION}-x86_64.AppImage"
    - ls -lh "$APPIMAGE"
    - (cd appimage && sha256sum "$(basename "$APPIMAGE")" | tee "$(basename "$APPIMAGE").sha256")
    - echo "VERSION=$VERSION" >> build.env
    - echo "APPIMAGE_NAME=$(basename "$APPIMAGE")" >> build.env
    - upload "$APPIMAGE" "$APPIMAGE.sha256"
  artifacts:
    name: stripe-analytics-$CI_COMMIT_REF_SLUG
    expose_as: AppImage
    paths:
      - appimage/
    reports:
      dotenv: build.env
    expire_in: 30 days

# Windows installer, cross-compiled on Linux. electron-builder runs Windows tools through Wine;
# NSIS also runs a 32-bit stub to build the uninstaller, hence wine32 (i386) next to wine64.
windows:
  extends: .node
  stage: build
  needs: [test]
  before_script:
    - dpkg --add-architecture i386
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends wine wine32:i386 wine64 > /dev/null
    - wine --version
    - npm ci --prefer-offline --no-audit --no-fund
  variables:
    WINEDEBUG: -all
  script:
    - *set-version
    - *upload-to-registry
    - npm run dist:win
    - mkdir -p windows
    - cp "release/stripe-analytics-${VERSION}-setup-x64.exe" windows/
    - EXE="windows/stripe-analytics-${VERSION}-setup-x64.exe"
    - ls -lh "$EXE"
    - (cd windows && sha256sum "$(basename "$EXE")" | tee "$(basename "$EXE").sha256")
    - echo "WINDOWS_NAME=$(basename "$EXE")" >> windows.env
    - upload "$EXE" "$EXE.sha256"
  artifacts:
    name: stripe-analytics-windows-$CI_COMMIT_REF_SLUG
    expose_as: Windows installer
    paths:
      - windows/
    reports:
      dotenv: windows.env
    expire_in: 30 days

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: appimage
      artifacts: true
    - job: windows
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - echo "Releasing $CI_COMMIT_TAG ($APPIMAGE_NAME, $WINDOWS_NAME)"
  release:
    tag_name: $CI_COMMIT_TAG
    name: Stripe Analytics $CI_COMMIT_TAG
    description: |
      Stripe Analytics $VERSION for Linux (AppImage) and Windows (installer).

      - Linux: `chmod +x $APPIMAGE_NAME && ./$APPIMAGE_NAME`
      - Windows: run `$WINDOWS_NAME` (unsigned: SmartScreen asks to confirm, "More info" → "Run anyway").

      On first start the app asks for a restricted, read-only Stripe key and saves it to
      `~/.config/vaslabs-ltd/stripe-analytics/.env` (Linux) or `%APPDATA%\vaslabs-ltd\stripe-analytics\.env` (Windows).
    assets:
      links:
        - name: $APPIMAGE_NAME
          url: $PACKAGE_REGISTRY_URL/$VERSION/$APPIMAGE_NAME
          link_type: package
          direct_asset_path: /stripe-analytics.AppImage
        - name: $APPIMAGE_NAME.sha256
          url: $PACKAGE_REGISTRY_URL/$VERSION/$APPIMAGE_NAME.sha256
          link_type: other
        - name: $WINDOWS_NAME
          url: $PACKAGE_REGISTRY_URL/$VERSION/$WINDOWS_NAME
          link_type: package
          direct_asset_path: /stripe-analytics-setup.exe
        - name: $WINDOWS_NAME.sha256
          url: $PACKAGE_REGISTRY_URL/$VERSION/$WINDOWS_NAME.sha256
          link_type: other
